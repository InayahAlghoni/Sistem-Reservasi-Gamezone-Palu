<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <!-- ===== Sosial media ===== -->

    <!-- Instagram -->
    <symbol id="i-ig" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
    </symbol>

    <!-- WhatsApp -->
    <symbol id="i-wa" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21l1.7-5.1A8.5 8.5 0 1 1 8.1 19.3z"/>
      <path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.3-1.4-2-1-.9.7a3.6 3.6 0 0 1-1.9-1.9l.7-.9-1-2z"/>
    </symbol>

    <!-- TikTok -->
    <symbol id="i-tt" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/>
      <path d="M14 3c.4 2.6 2 4.2 5 4.5"/>
    </symbol>


    <!-- ===== Navigasi ===== -->

    <!-- Menu (tiga garis) -->
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </symbol>

    <!-- Panah kanan -->
    <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 6 6 6-6 6"/>
    </symbol>

    <!-- Panah kiri -->
    <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 6-6 6 6 6"/>
    </symbol>


    <!-- ===== Form reservasi ===== -->

    <!-- Nama pelanggan -->
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0 1 16 0"/>
    </symbol>

    <!-- Stik game / konsol -->
    <symbol id="i-pad" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="12" rx="4"/>
      <path d="M7 10v4M5 12h4"/>
      <circle cx="16" cy="11" r=".8" fill="currentColor"/>
      <circle cx="18" cy="13" r=".8" fill="currentColor"/>
    </symbol>

    <!-- Label harga -->
    <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12V4h8l10 10-8 8z"/>
      <circle cx="7.5" cy="8.5" r="1.2" fill="currentColor"/>
    </symbol>

    <!-- Kalender (pilih tanggal) -->
    <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="3"/>
      <path d="M8 3v4M16 3v4M3 10h18"/>
    </symbol>

    <!-- Jam pasir (durasi) -->
    <symbol id="i-hour" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>
    </symbol>

    <!-- Jam dinding (jam mulai) -->
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3 2"/>
    </symbol>

    <!-- Daftar -->
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>
    </symbol>

    <!-- Upload bukti pembayaran -->
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
    </symbol>


    <!-- ===== Lainnya ===== -->

    <!-- Lokasi / alamat -->
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/>
      <circle cx="12" cy="9" r="2.5"/>
    </symbol>

    <!-- Centang (berhasil) -->
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12.5 4.5 4.5L19 7.5"/>
    </symbol>

    <!-- Mikrofon (karaoke) -->
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
    </symbol>

  </defs>
</svg>
